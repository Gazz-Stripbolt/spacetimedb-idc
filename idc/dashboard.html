<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDC Dashboard</title>
<style>
  :root { --bg:#f5f4f0; --card:#fff; --fg:#1c1c1f; --muted:#6c6c72; --line:#e3e1db; --accent:#e8730c; --ok:#1f8a4c; --bad:#c2372f; --warn:#b7791f; --chip:#efeee9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141416; --card:#1e1e22; --fg:#ececf0; --muted:#9c9ca4; --line:#2e2e34; --chip:#2a2a30; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, sans-serif; }
  header { max-width:1180px; margin:0 auto; padding:18px 16px 6px; display:flex; flex-wrap:wrap; align-items:baseline; gap:10px; }
  h1 { font-size:20px; margin:0; }
  .sub { color:var(--muted); font-size:13px; }
  main { max-width:1180px; margin:0 auto; padding:10px 16px 32px; display:grid; gap:14px; }
  .controls { display:flex; flex-wrap:wrap; gap:14px; }
  .controls form { display:flex; gap:6px; align-items:center; flex-wrap:wrap; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .controls b { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-right:4px; }
  select, input { font:inherit; padding:5px 8px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  input[type=number] { width:64px; }
  button { font:inherit; padding:6px 12px; border:0; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:860px) { .grid { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; min-width:0; }
  .card h2 { margin:0 0 4px; font-size:16px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .chip { font-size:11px; font-weight:500; background:var(--chip); border-radius:99px; padding:1px 8px; color:var(--muted); }
  .chip.ok { color:var(--ok); } .chip.warn { color:var(--warn); }
  h3 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:14px 0 6px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  td.wrap { white-space:normal; }
  .confirmed { color:var(--ok); } .rejected { color:var(--bad); } .pending { color:var(--warn); }
  .num { font-variant-numeric:tabular-nums; text-align:right; }
  #timeline { font:12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; max-height:300px; overflow:auto; }
  #timeline div { white-space:pre; padding:2px 0; border-bottom:1px dashed var(--line); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ev-delivered, .ev-applied, .ev-paired { color:var(--ok); } .ev-retry { color:var(--warn); } .ev-dead { color:var(--bad); } .ev-duplicate { color:var(--muted); }
  #rpc { font:12px ui-monospace, monospace; color:var(--muted); }
  .flash { animation: flash 1s ease-out; } @keyframes flash { from { background: color-mix(in srgb, var(--accent) 25%, transparent); } to { background: transparent; } }
</style>
</head>
<body>
<header>
  <h1><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" style="vertical-align:-2px"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg> Inter-database communication</h1>
  <span class="sub">Two SpacetimeDB databases, talking over HTTP. Everything below is pushed, nothing is polled between the databases.</span>
</header>
<main>
  <div class="controls">
    <form id="order"><b>shop</b>
      <select name="sku"><option>gear</option><option>sprocket</option><option>rocket-boots</option><option>unobtainium</option></select>
      <input name="qty" type="number" min="1" max="1000" value="2">
      <button>Place order</button>
      <button type="button" class="ghost" id="burst">Burst ×10</button>
      <button type="button" class="ghost" id="quote">Quote (RPC)</button>
    </form>
    <form id="restock"><b>warehouse</b>
      <select name="sku"><option>gear</option><option>sprocket</option><option>rocket-boots</option></select>
      <input name="qty" type="number" min="1" max="1000" value="5">
      <button>Restock</button>
    </form>
  </div>
  <div id="rpc"></div>
  <div class="grid" id="dbs"></div>
  <section class="card">
    <h2>Message timeline <span class="chip">both databases, newest first</span></h2>
    <div id="timeline"></div>
  </section>
</main>
<script>
const CONFIG = /*CONFIG*/{};
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const url = (base) => { try { const u = new URL(base, location.href); return u.host === location.host ? u.pathname : u.href; } catch { return base; } };
const dbs = CONFIG.dbs.map((d) => ({ ...d, base: url(d.base) }));
const byName = Object.fromEntries(dbs.map((d) => [d.name, d]));

async function call(db, fn, args) {
  const r = await fetch(`${byName[db].base}/call/${fn}`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(args) });
  const text = await r.text();
  if (!r.ok) throw new Error(text || r.status);
  return text;
}

document.querySelector("#order").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  await call("shop", "place_order", [f.get("sku"), Number(f.get("qty"))]).catch((err) => alert(err.message));
});
document.querySelector("#burst").addEventListener("click", async () => {
  const f = new FormData(document.querySelector("#order"));
  await Promise.all(Array.from({ length: 10 }, () => call("shop", "place_order", [f.get("sku"), 1]).catch(() => {})));
});
document.querySelector("#quote").addEventListener("click", async () => {
  const sku = new FormData(document.querySelector("#order")).get("sku");
  const t0 = performance.now();
  let out = await call("shop", "quote", [sku]).catch((err) => err.message);
  try { out = JSON.stringify(JSON.parse(JSON.parse(out))); } catch {}
  document.querySelector("#rpc").textContent = `quote(${sku}) → shop procedure → warehouse /rpc/stock → ${out}  (${Math.round(performance.now() - t0)} ms round trip)`;
});
document.querySelector("#restock").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  await call("warehouse", "restock", [f.get("sku"), Number(f.get("qty"))]).catch((err) => alert(err.message));
});

const table = (rows, cols) => rows.length
  ? `<table><tr>${cols.map(([h]) => `<th>${h}</th>`).join("")}</tr>${rows.map((r) => `<tr>${cols.map(([, f, cls]) => `<td class="${cls || ""}">${f(r)}</td>`).join("")}</tr>`).join("")}</table>`
  : `<div class="sub">nothing yet</div>`;

function renderDb(name, s) {
  const idc = s.idc;
  const peers = dbs.filter((d) => d.name !== name).map((d) => d.name);
  const paired = peers.every((p) => idc.has_token_for.includes(p) && idc.trusts.includes(p));
  let body = "";
  if (s.orders) {
    body += `<h3>Orders</h3>` + table(s.orders, [
      ["#", (o) => o.id, "num"], ["sku", (o) => esc(o.sku)], ["qty", (o) => o.qty, "num"],
      ["status", (o) => `<span class="${o.status}">${o.status}</span>`],
      ["round trip", (o) => o.round_trip_ms == null ? "…" : `${o.round_trip_ms.toFixed(1)} ms`, "num"],
      ["note", (o) => esc(o.note), "wrap"],
    ]);
    body += `<h3>Stock mirror <span class="chip">pushed by warehouse</span></h3>` + table(s.stock_mirror, [["sku", (r) => esc(r.sku)], ["qty", (r) => r.qty, "num"]]);
  }
  if (s.stock) {
    body += `<h3>Stock</h3>` + table(s.stock, [["sku", (r) => esc(r.sku)], ["qty", (r) => r.qty, "num"]]);
    body += `<h3>Reservations</h3>` + table(s.reservations, [["#", (r) => r.id, "num"], ["for", (r) => `${esc(r.peer)} #${r.order_id}`], ["sku", (r) => esc(r.sku)], ["qty", (r) => r.qty, "num"]]);
  }
  return `<section class="card"><h2>${esc(name)}
    <span class="chip">transport: ${esc(idc.transport)}</span>
    <span class="chip ${paired ? "ok" : "warn"}">${paired ? "paired" : "pairing…"}</span>
    <span class="chip ${idc.outbox_pending ? "warn" : ""}">outbox ${idc.outbox_pending}${idc.outbox_dead ? ` · dead ${idc.outbox_dead}` : ""}</span>
  </h2>${body}</section>`;
}

let lastTop = "";
async function refresh() {
  const states = await Promise.all(dbs.map((d) => fetch(`${d.base}/route/api/state`).then((r) => r.json()).catch(() => null)));
  document.querySelector("#dbs").innerHTML = dbs.map((d, i) => states[i] ? renderDb(d.name, states[i]) : `<section class="card"><h2>${esc(d.name)}</h2><div class="sub">unreachable</div></section>`).join("");
  const events = states.flatMap((s, i) => s ? s.idc.log.map((l) => ({ ...l, db: dbs[i].name })) : []);
  events.sort((a, b) => b.at_us - a.at_us || b.id - a.id);
  const lines = events.slice(0, 80).map((l) => {
    const t = new Date(l.at_us / 1000).toISOString().slice(11, 23);
    const arrow = l.direction === "out" ? `${l.db} → ${l.peer}` : `${l.db} ← ${l.peer}`;
    const lat = l.latency_us ? ` · ${(l.latency_us / 1000).toFixed(1)} ms` : "";
    return `<div class="ev-${esc(l.event)}" title="${esc(l.detail)}">${t}  ${esc(arrow).padEnd(22, " ")} ${esc(l.kind).padEnd(12, " ")} ${esc(l.event)}${lat}  <span class="sub">${esc(l.transport)} ${esc(l.msg_id)}</span></div>`;
  });
  const tl = document.querySelector("#timeline");
  tl.innerHTML = lines.join("");
  if (lines[0] && lines[0] !== lastTop) { tl.firstElementChild?.classList.add("flash"); lastTop = lines[0]; }
}
refresh();
setInterval(refresh, 800);
</script>
</body>
</html>
