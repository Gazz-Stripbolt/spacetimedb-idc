name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain (wasm32)
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --component clippy,rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - name: Rust
        run: |
          cargo fmt --all --check
          cargo clippy --release --target wasm32-unknown-unknown -- -D warnings
      - name: TypeScript
        run: npm run typecheck
      - name: C#
        run: |
          dotnet build demo/csharp/shop -c Release
          dotnet build demo/csharp/warehouse -c Release

  # Standalone blocks module HTTP to loopback, so the tests use a build with
  # SpacetimeDB's own `allow_loopback_http_for_tests` feature, cached per version.
  dev-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Install SpacetimeDB CLI
        run: |
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - id: ver
        run: echo "version=$(spacetime --version | sed -n 's/.*tool version \([0-9.]*\);.*/\1/p')" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: .dev-server/spacetimedb-standalone-${{ steps.ver.outputs.version }}
          key: dev-server-${{ runner.os }}-${{ steps.ver.outputs.version }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          scripts/dev-server.sh build
          rm -rf .dev-server/SpacetimeDB-*

  # Every shop language against every warehouse language: TS⇄Rust, Rust⇄Rust, C#⇄Rust,
  # TS⇄C#, Rust⇄C#, C#⇄C#. Each runs the full suite on both transports.
  e2e:
    needs: dev-server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shop: [rust, typescript, csharp]
        warehouse: [rust, csharp]
    name: e2e (${{ matrix.shop }} shop ⇄ ${{ matrix.warehouse }} warehouse)
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain (wasm32)
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # C# modules build with NativeAOT-LLVM (.NET 10 on Linux).
      - uses: actions/setup-dotnet@v4
        if: matrix.shop == 'csharp' || matrix.warehouse == 'csharp'
        with:
          dotnet-version: 10.0.x
      - name: Install SpacetimeDB CLI
        run: |
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        with:
          path: .dev-server/spacetimedb-standalone-${{ needs.dev-server.outputs.version }}
          key: dev-server-${{ runner.os }}-${{ needs.dev-server.outputs.version }}
          fail-on-cache-miss: true
      - name: Start dev server
        run: |
          mkdir -p ~/.config/spacetime
          nohup scripts/dev-server.sh start > server.log 2>&1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://127.0.0.1:3000/v1/ping && break; sleep 1; done
      - name: Deploy
        run: SHOP_LANG=${{ matrix.shop }} WAREHOUSE_LANG=${{ matrix.warehouse }} scripts/deploy.sh
      - name: End-to-end tests
        run: scripts/e2e.sh
      - name: Benchmark (route transport)
        run: |
          for db in warehouse shop; do
            (cd /tmp && IDC_TRANSPORT=route spacetime publish $db -s local --env-only -y)
            spacetime call $db idc_kick -s local
          done
          scripts/bench.sh 300 16
      - name: Server log
        if: failure()
        run: tail -n 200 server.log || true
